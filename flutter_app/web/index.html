<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeuroTask: Motor de Foco — Aplicación Mobile para Descompresión Cognitiva y Secuenciación DAG">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="neurotask">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NeuroTask: Motor de Foco</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // ==========================================
    // 1. Web Speech API + Audio Analyser Bridge
    // ==========================================
    window.NeuroTaskVoice = {
      recognition: null,
      isListening: false,
      
      isSupported: function() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      },

      start: function(onResult, onSoundLevel, onError, onEnd) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          if (onError) onError("Tu navegador no soporta Web Speech API");
          return;
        }

        try {
          if (window.NeuroTaskVoice.recognition) {
            try { window.NeuroTaskVoice.recognition.abort(); } catch(e) {}
          }

          const rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'es-ES';

          rec.onresult = function(event) {
            let fullTranscript = '';
            for (let i = 0; i < event.results.length; ++i) {
              fullTranscript += event.results[i][0].transcript;
            }
            if (onResult) onResult(fullTranscript);
          };

          rec.onerror = function(event) {
            console.warn("Web Speech error:", event.error);
            if (onError) onError(event.error);
          };

          rec.onend = function() {
            window.NeuroTaskVoice.isListening = false;
            if (onEnd) onEnd();
          };

          rec.start();
          window.NeuroTaskVoice.recognition = rec;
          window.NeuroTaskVoice.isListening = true;

          // Microphone sound level meter using Web Audio API
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
              try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const src = ctx.createMediaStreamSource(stream);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 64;
                src.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function checkAudio() {
                  if (!window.NeuroTaskVoice.isListening) {
                    try {
                      stream.getTracks().forEach(function(t) { t.stop(); });
                      ctx.close();
                    } catch(e) {}
                    return;
                  }
                  analyser.getByteFrequencyData(dataArray);
                  let sum = 0;
                  for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                  }
                  const avg = (sum / dataArray.length) / 255.0; // 0.0 to 1.0
                  if (onSoundLevel) onSoundLevel(avg);
                  requestAnimationFrame(checkAudio);
                }
                checkAudio();
              } catch (e) {
                console.warn("Audio meter context error:", e);
              }
            }).catch(function(err) {
              console.warn("Microphone stream error:", err);
            });
          }
        } catch (err) {
          console.error("SpeechRecognition start error:", err);
          if (onError) onError(err.toString());
        }
      },

      stop: function() {
        window.NeuroTaskVoice.isListening = false;
        if (window.NeuroTaskVoice.recognition) {
          try {
            window.NeuroTaskVoice.recognition.stop();
          } catch(e) {}
        }
      }
    };

    // ==========================================
    // 2. Pure Web Audio Brown Noise & Zen Chime Synthesizer
    // ==========================================
    window.NeuroTaskAudio = {
      ctx: null,
      brownNoiseNode: null,
      gainNode: null,
      isPlayingBrownNoise: false,

      _getAudioContext: function() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },

      playBrownNoise: function() {
        if (this.isPlayingBrownNoise) return;

        try {
          const ctx = this._getAudioContext();
          const bufferSize = 5 * ctx.sampleRate; // 5-second seamless loop buffer
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);

          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            // Brownian noise integration formula
            lastOut = (lastOut + (0.02 * white)) / 1.02;
            output[i] = lastOut * 3.2; // Gain normalization
          }

          // Create source node
          const source = ctx.createBufferSource();
          source.buffer = noiseBuffer;
          source.loop = true;

          // Gentle warm lowpass filter to produce deep soothing rumble
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 500;

          // Gain node with soft fade-in
          this.gainNode = ctx.createGain();
          this.gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
          this.gainNode.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.8);

          source.connect(filter);
          filter.connect(this.gainNode);
          this.gainNode.connect(ctx.destination);

          source.start(0);
          this.brownNoiseNode = source;
          this.isPlayingBrownNoise = true;
        } catch (e) {
          console.warn("Brown noise synthesis error:", e);
        }
      },

      stopBrownNoise: function() {
        if (!this.isPlayingBrownNoise || !this.brownNoiseNode) return;

        try {
          const ctx = this._getAudioContext();
          if (this.gainNode) {
            this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, ctx.currentTime);
            this.gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
          }
          setTimeout(() => {
            if (this.brownNoiseNode) {
              try { this.brownNoiseNode.stop(); } catch(e) {}
              this.brownNoiseNode = null;
            }
            this.isPlayingBrownNoise = false;
          }, 500);
        } catch (e) {
          this.isPlayingBrownNoise = false;
        }
      },

      playZenChime: function() {
        try {
          const ctx = this._getAudioContext();
          const osc = ctx.createOscillator();
          const chimeGain = ctx.createGain();

          // 528 Hz Solfeggio / Zen harmonic frequency
          osc.type = 'sine';
          osc.frequency.setValueAtTime(528, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1056, ctx.currentTime + 0.6);

          chimeGain.gain.setValueAtTime(0.35, ctx.currentTime);
          chimeGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);

          osc.connect(chimeGain);
          chimeGain.connect(ctx.destination);

          osc.start();
          osc.stop(ctx.currentTime + 1.2);
        } catch (e) {
          console.warn("Zen chime error:", e);
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
