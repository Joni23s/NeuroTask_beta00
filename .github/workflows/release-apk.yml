name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths: ['flutter_app/**', '.github/workflows/release-apk.yml']
  pull_request:
    branches: [ main ]
    paths: ['flutter_app/**', '.github/workflows/release-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk-release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Maven Central GCS mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/maven-mirror.init.gradle.kts"
          val gcsMavenCentral = java.net.URI("https://maven-central.storage-download.googleapis.com/maven2/")

          fun RepositoryHandler.useGcsMavenCentralFirst(includePluginPortal: Boolean = false) {
              val existing = toList()
              clear()
              maven {
                  name = "GCSMavenCentral"
                  url = gcsMavenCentral
              }
              google()
              existing.forEach { repo ->
                  if (repo is MavenArtifactRepository &&
                      (repo.url.host == "repo.maven.apache.org" || repo.url == gcsMavenCentral)
                  ) {
                      // Replaced by GCSMavenCentral above to prevent HTTP 429 on shared CI runners
                  } else {
                      add(repo)
                  }
              }
              if (includePluginPortal && none { it is MavenArtifactRepository && it.url.host == "plugins.gradle.org" }) {
                  gradlePluginPortal()
              }
          }

          beforeSettings {
              buildscript.repositories.useGcsMavenCentralFirst(includePluginPortal = true)
              pluginManagement.repositories.useGcsMavenCentralFirst(includePluginPortal = true)
              dependencyResolutionManagement.repositories.useGcsMavenCentralFirst(includePluginPortal = false)
          }

          settingsEvaluated {
              pluginManagement.repositories.useGcsMavenCentralFirst(includePluginPortal = true)
              dependencyResolutionManagement.repositories.useGcsMavenCentralFirst(includePluginPortal = false)
          }

          beforeProject {
              buildscript.repositories.useGcsMavenCentralFirst(includePluginPortal = true)
          }

          projectsEvaluated {
              allprojects {
                  buildscript.repositories.useGcsMavenCentralFirst(includePluginPortal = true)
                  if (repositories.isNotEmpty()) {
                      repositories.useGcsMavenCentralFirst(includePluginPortal = false)
                  }
              }
          }
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Dart static analysis
        working-directory: ./flutter_app
        run: dart analyze lib/ test/

      - name: Run Flutter unit and widget tests
        working-directory: ./flutter_app
        run: flutter test

      - name: Extract version metadata
        id: meta
        working-directory: ./flutter_app
        shell: bash
        run: |
          set -euo pipefail
          RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/' | tr -d "\r\"'")
          BASE_VERSION="${RAW_VER%%+*}"
          if [ -z "${BASE_VERSION}" ]; then
            echo "Error: Could not parse version from pubspec.yaml" >&2
            exit 1
          fi
          BUILD_NUM="${{ github.run_number }}"
          RELEASE_TAG="v${BASE_VERSION}-b${BUILD_NUM}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "base_version=${BASE_VERSION}"
            echo "build_num=${BUILD_NUM}"
            echo "release_tag=${RELEASE_TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "commit_subject<<__COMMIT_EOF__"
            echo "${COMMIT_SUBJECT}"
            echo "__COMMIT_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build Android release APK
        working-directory: ./flutter_app
        run: flutter build apk --release --build-name="${{ steps.meta.outputs.base_version }}" --build-number="${{ steps.meta.outputs.build_num }}"

      - name: Stage and verify APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_dist
          cp ./flutter_app/build/app/outputs/flutter-apk/app-release.apk release_dist/NeuroTask.apk
          (cd release_dist && sha256sum NeuroTask.apk > NeuroTask.apk.sha256 && sha256sum -c NeuroTask.apk.sha256)
          python3 - << 'PY'
          import zipfile, sys
          required = ["AndroidManifest.xml", "classes.dex", "lib/arm64-v8a/libapp.so"]
          with zipfile.ZipFile("release_dist/NeuroTask.apk") as zf:
              entries = set(zf.namelist())
          missing = [item for item in required if item not in entries]
          if missing:
              print(f"Error: APK missing required entries: {missing}", file=sys.stderr)
              sys.exit(1)
          print("Verified Android APK internal structure:", required)
          PY

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neurotask-android-apk
          path: |
            release_dist/NeuroTask.apk
            release_dist/NeuroTask.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
          BUILD_NUM: ${{ steps.meta.outputs.build_num }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          COMMIT_SUBJECT: ${{ steps.meta.outputs.commit_subject }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_BYTES=$(stat -c%s release_dist/NeuroTask.apk)
          APK_SIZE=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f MB (%d bytes)", b / 1048576, b }')
          APK_SHA256=$(cut -d' ' -f1 release_dist/NeuroTask.apk.sha256)
          TAG_APK_URL="https://github.com/${REPO}/releases/download/${TAG}/NeuroTask.apk"
          LATEST_APK_URL="https://github.com/${REPO}/releases/latest/download/NeuroTask.apk"

          {
            printf '## NeuroTask Android APK — %s\n\n' "$TAG"
            printf -- '- **Versión:** `%s+%s`\n' "$BASE_VERSION" "$BUILD_NUM"
            printf -- '- **Commit:** `%s` — %s\n' "$SHORT_SHA" "$COMMIT_SUBJECT"
            printf -- '- **Tamaño del APK:** %s\n' "$APK_SIZE"
            printf -- '- **SHA-256:** `%s`\n\n' "$APK_SHA256"
            printf '### Enlaces de descarga directa\n'
            printf -- '- **Esta versión (%s):** [Descargar NeuroTask.apk](%s)\n' "$TAG" "$TAG_APK_URL"
            printf -- '- **Última versión permanente:** [Descargar último NeuroTask.apk](%s)\n\n' "$LATEST_APK_URL"
            printf '### Instalación en Android (3 pasos)\n'
            printf '1. Descarga `NeuroTask.apk` desde uno de los enlaces anteriores en tu dispositivo Android.\n'
            printf '2. Abre el archivo descargado y autoriza la instalación desde tu navegador o gestor de archivos si el sistema lo solicita.\n'
            printf '3. Si aparece el aviso de **Google Play Protect** (por firma académica de desarrollo), toca **Más detalles -> Instalar de todas formas**.\n'
          } > release_notes.md

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release_dist/NeuroTask.apk release_dist/NeuroTask.apk.sha256 --clobber -R "$REPO"
            gh release edit "$TAG" --title "NeuroTask ${TAG}" --notes-file release_notes.md --latest -R "$REPO"
          else
            gh release create "$TAG" release_dist/NeuroTask.apk release_dist/NeuroTask.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "NeuroTask ${TAG}" \
              --notes-file release_notes.md \
              --latest \
              -R "$REPO"
          fi

      - name: Verify Latest Release APK download and SHA-256
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LATEST_APK_URL="https://github.com/${REPO}/releases/latest/download/NeuroTask.apk"
          EXPECTED_SHA256=$(cut -d' ' -f1 release_dist/NeuroTask.apk.sha256)
          VERIFIED=false
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -o /tmp/NeuroTask_latest_check.apk "$LATEST_APK_URL"; then
              ACTUAL_SHA256=$(sha256sum /tmp/NeuroTask_latest_check.apk | cut -d' ' -f1)
              if [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ]; then
                echo "Verified Latest Release APK download (attempt ${attempt}): SHA-256=${ACTUAL_SHA256}"
                VERIFIED=true
                break
              fi
            fi
            echo "Waiting for GitHub Releases propagation (attempt ${attempt}/6)..."
            sleep 5
          done
          rm -f /tmp/NeuroTask_latest_check.apk
          if [ "$VERIFIED" != "true" ]; then
            echo "Error: Could not verify Latest Release APK at ${LATEST_APK_URL}" >&2
            exit 1
          fi
