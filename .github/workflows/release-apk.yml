name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths: ['flutter_app/**', '.github/workflows/release-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk-release"
  cancel-in-progress: true

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Run Dart static analysis
        working-directory: ./flutter_app
        run: dart analyze lib/ test/

      - name: Run Flutter unit and widget tests
        working-directory: ./flutter_app
        run: flutter test

      - name: Extract version metadata
        id: meta
        working-directory: ./flutter_app
        shell: bash
        run: |
          set -euo pipefail
          RAW_VER=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/' | tr -d "\r\"'")
          BASE_VERSION="${RAW_VER%%+*}"
          if [ -z "${BASE_VERSION}" ]; then
            echo "Error: Could not parse version from pubspec.yaml" >&2
            exit 1
          fi
          BUILD_NUM="${{ github.run_number }}"
          RELEASE_TAG="v${BASE_VERSION}-b${BUILD_NUM}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "base_version=${BASE_VERSION}"
            echo "build_num=${BUILD_NUM}"
            echo "release_tag=${RELEASE_TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "commit_subject<<__COMMIT_EOF__"
            echo "${COMMIT_SUBJECT}"
            echo "__COMMIT_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build Android release APK
        working-directory: ./flutter_app
        run: flutter build apk --release --build-name="${{ steps.meta.outputs.base_version }}" --build-number="${{ steps.meta.outputs.build_num }}"

      - name: Stage APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_dist
          cp ./flutter_app/build/app/outputs/flutter-apk/app-release.apk release_dist/NeuroTask.apk
          (cd release_dist && sha256sum NeuroTask.apk > NeuroTask.apk.sha256)

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neurotask-android-apk
          path: |
            release_dist/NeuroTask.apk
            release_dist/NeuroTask.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
          BUILD_NUM: ${{ steps.meta.outputs.build_num }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          COMMIT_SUBJECT: ${{ steps.meta.outputs.commit_subject }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_BYTES=$(stat -c%s release_dist/NeuroTask.apk)
          APK_SIZE=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f MB (%d bytes)", b / 1048576, b }')
          APK_SHA256=$(cut -d' ' -f1 release_dist/NeuroTask.apk.sha256)
          TAG_APK_URL="https://github.com/${REPO}/releases/download/${TAG}/NeuroTask.apk"
          LATEST_APK_URL="https://github.com/${REPO}/releases/latest/download/NeuroTask.apk"

          {
            printf '## NeuroTask Android APK — %s\n\n' "$TAG"
            printf -- '- **Versión:** `%s+%s`\n' "$BASE_VERSION" "$BUILD_NUM"
            printf -- '- **Commit:** `%s` — %s\n' "$SHORT_SHA" "$COMMIT_SUBJECT"
            printf -- '- **Tamaño del APK:** %s\n' "$APK_SIZE"
            printf -- '- **SHA-256:** `%s`\n\n' "$APK_SHA256"
            printf '### Enlaces de descarga directa\n'
            printf -- '- **Esta versión (%s):** [Descargar NeuroTask.apk](%s)\n' "$TAG" "$TAG_APK_URL"
            printf -- '- **Última versión permanente:** [Descargar último NeuroTask.apk](%s)\n\n' "$LATEST_APK_URL"
            printf '### Instalación en Android (3 pasos)\n'
            printf '1. Descarga `NeuroTask.apk` desde uno de los enlaces anteriores en tu dispositivo Android.\n'
            printf '2. Abre el archivo descargado y autoriza la instalación desde tu navegador o gestor de archivos si el sistema lo solicita.\n'
            printf '3. Si aparece el aviso de **Google Play Protect** (por firma académica de desarrollo), toca **Más detalles -> Instalar de todas formas**.\n'
          } > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_dist/NeuroTask.apk release_dist/NeuroTask.apk.sha256 --clobber
            gh release edit "$TAG" --title "NeuroTask ${TAG}" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" release_dist/NeuroTask.apk release_dist/NeuroTask.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "NeuroTask ${TAG}" \
              --notes-file release_notes.md \
              --latest
          fi
